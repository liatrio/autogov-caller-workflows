name: Build Blob Composite Action

description: >-
  A composite action that is placed in ./.github/actions/build-blob/action.yaml whereby
  ./.github/workflows/rw-<permissions_path>-attest-blob.yaml will trigger this action to build the blob(s). The steps
  can be adjusted per the user's need just as long as the result blob file(s) is referenced for
  downstream jobs.

runs:
  using: composite
  steps:
    - name: Build Blob
      shell: bash
      env: # env indirection instead of inline ${{ }} so context values never hit the shell parser
        TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        REPOSITORY: ${{ github.repository }}
        ACTION: ${{ github.action }}
      run: |
        echo "i am a blob being created at $(date +'%Y-%m-%d %H:%M:%S') by $TRIGGERING_ACTOR by rw of
        $WORKFLOW_REF in the repo of $REPOSITORY by the action known as $ACTION." > i_am_blob &&
        echo "i am another blob being created at $(date +'%Y-%m-%d %H:%M:%S') by $TRIGGERING_ACTOR by rw of
        $WORKFLOW_REF in the repo of $REPOSITORY" > i_am_another_blob
